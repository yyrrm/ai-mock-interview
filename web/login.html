<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · AI 모의면접</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="appHeader"></header>

  <main class="container narrow" style="padding-top:48px;">
    <div class="card reveal">
      <div class="auth-icon">🔐</div>
      <div style="text-align:center;margin-bottom:24px;">
        <h2 style="font-size:24px;font-weight:800;">로그인</h2>
        <p style="color:var(--ink-soft);font-size:14.5px;margin-top:4px;">다시 오신 것을 환영합니다.</p>
      </div>

      <div class="form-error" id="err"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">아이디</label>
          <input type="text" id="username" placeholder="아이디" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">로그인</button>
      </form>

      <p class="form-hint" style="text-align:center;margin-top:18px;">
        아직 계정이 없으신가요? <a href="signup.html" style="color:var(--primary);font-weight:700;">회원가입</a>
      </p>
    </div>
  </main>

  <footer class="app-footer">© 2026 AI 모의면접 · 졸업작품 데모</footer>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const res = login({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      });
      if (!res.ok) {
        err.textContent = res.msg;
        return;
      }
      toast("로그인 성공! 👋");
      setTimeout(() => (location.href = "dashboard.html"), 700);
    });
  </script>
</body>
</html>
